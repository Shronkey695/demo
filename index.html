<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene>
             <a-assets>
      <audio id="bgm" src="Background2.mp3" preload="auto"></audio>
       <audio id="soundEffect1" src="2sounds.mp3" preload="auto"></audio>
           </a-assets>

            <a-camera>
                <a-cursor></a-cursor>
            </a-camera>
            <a-entity id="music" sound="src: #bgm; loop: true; volume: 0.4;"></a-entity>

        <a-Dodecahedron color="red" position="1 1 -4" sound="src: #soundEffect1; on: click; volume: 1;"></a-Dodecahedron>
        <a-torus color="blue" position="1 1 -4" radius="2" arc="360"
        animation="
        property: rotation;
        from: 0 0 0;
        to: 0 360 0;
        loop: true;
        dur: 2000;
        "></a-torus>
        </a-scene>
        
        <script>
      document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      const music = document.querySelector('#music');

      const startMusic = () => {
      music.components.sound.playSound();
    };

    // Fires once on the first user interaction
    scene.addEventListener('mousemove', startMusic, { once: true });
    window.addEventListener('touchstart', startMusic, { once: true });
  });
</script>




    </body>
</html>
